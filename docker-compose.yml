services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: usada_bali
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d usada_bali" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
