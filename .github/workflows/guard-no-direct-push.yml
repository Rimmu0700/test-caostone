name: Guard No Direct Push
on:
  push:
    branches: [main, staging]

jobs:
  check-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Cek apakah commit ini berasal dari PR yang sudah di-merge
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;

            async function isFromMergedPR() {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: sha,
              });
              return prs.some((pr) => pr.merged_at !== null);
            }

            // GitHub butuh beberapa detik untuk mengindeks hubungan
            // "commit ini berasal dari PR mana" setelah merge baru terjadi.
            // Coba 5x dengan jeda, baru vonis gagal kalau tetap tidak ketemu.
            let merged = false;
            for (let attempt = 1; attempt <= 5; attempt++) {
              merged = await isFromMergedPR();
              if (merged) break;
              console.log(`Percobaan ${attempt}: belum terindeks, tunggu 5 detik...`);
              await new Promise((r) => setTimeout(r, 5000));
            }

            if (!merged) {
              core.setFailed(
                `Push langsung terdeteksi di ${context.ref} oleh @${context.actor} ` +
                `(commit ${sha}). Semua perubahan wajib lewat Pull Request + review.`
              );
            } else {
              console.log("OK: commit ini berasal dari PR yang sah dan sudah di-merge.");
            }