name: Secret Scan
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (binary langsung, bukan action berbayar)
        run: |
          VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep '"tag_name"' | cut -d '"' -f4 | sed 's/^v//')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Scan seluruh riwayat commit untuk secret
        run: |
          gitleaks detect --source . --verbose --redact \
            --report-format json --report-path gitleaks-report.json

      - name: Ringkasan hasil scan
        if: always()
        run: |
          echo "## Hasil Gitleaks Secret Scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -s gitleaks-report.json ] && [ "$(cat gitleaks-report.json)" != "[]" ]; then
            COUNT=$(jq 'length' gitleaks-report.json)
            echo "⚠️ Ditemukan **$COUNT** kemungkinan secret. Lihat log di atas untuk detail file & baris." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Tidak ada secret terdeteksi." >> "$GITHUB_STEP_SUMMARY"
          fi