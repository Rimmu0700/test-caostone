name: CI
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt --break-system-packages
      - run: ruff check backend/
      - run: pytest backend/